Cloud=true
Local=true

Badness = "the newly initialized bundle from the 'mlops-stacks' template contains two validation warnings in the configuration"

Ignore = [
    "config.json"
]

[[Repls]]
Old = "aws|azure|gcp"
New = "[CLOUD_ENV_BASE]"

# $TESTDIR uses backslashes on Windows, so match either separator to normalize
# the local template path to the cloud template name "mlops-stacks".
[[Repls]]
Old = 'bundle init .*[\\/]mlops-stacks/template'
New = "bundle init mlops-stacks"

# Local-only: renames (remove+add) in BOTH the top-level and target blocks of a
# split task sequence, exercising block-scoped indicesToReplaceMap reuse.
RecordRequests = false
Ignore = [".databricks", "databricks.yml", "databricks.yml.backup"]

[Env]
DATABRICKS_BUNDLE_ENABLE_EXPERIMENTAL_YAML_SYNC = "true"

[EnvMatrix]
DATABRICKS_BUNDLE_ENGINE = ["direct", "terraform"]

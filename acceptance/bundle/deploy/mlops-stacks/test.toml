Cloud=true
Local=true

Badness = "the newly initialized bundle from the 'mlops-stacks' template contains two validation warnings in the configuration"

Ignore = [
    "config.json"
]

[[Repls]]
Old = "aws|azure|gcp"
New = "[CLOUD_ENV_BASE]"

# On Windows $TESTDIR expands with backslash separators, so match either separator
# before "mlops-stacks" to normalize the local template path to the cloud template name.
[[Repls]]
Old = 'bundle init .*[\\/]mlops-stacks/template'
New = "bundle init mlops-stacks"
